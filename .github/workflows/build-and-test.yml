name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: |
        dotnet restore ./RaceDay.API/RaceDay.API.csproj
        dotnet restore ./RaceDay.Web/RaceDay.Web.csproj
      
    - name: Build Solution (API + MVC)
      run: |
        dotnet build ./RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release
        dotnet build ./RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release
      
    - name: Test
      run: |
        dotnet test ./RaceDay.API/RaceDay.API.csproj --no-build --verbosity normal
        dotnet test ./RaceDay.Web/RaceDay.Web.csproj --no-build --verbosity normal
